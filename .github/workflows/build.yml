name: Build landing page

on:
  push:
    branches: [main, feat/landing-v2-hero-carousel]
  pull_request:
    branches: [main, feat/landing-conversion-polish]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
